<div class="mb-4 grid grid-cols-2 gap-1 rounded-lg bg-gray-100 p-1">
  <button
    type="button"
    class="rounded-md px-3 py-2 text-sm font-medium transition cursor-pointer"
    [class]="mode() === 'login' ? 'bg-white text-black shadow' : 'text-gray-500 hover:text-black'"
    (click)="switchMode.emit('login')"
  >
    Iniciar sesión
  </button>
  <button
    type="button"
    class="rounded-md px-3 py-2 text-sm font-medium transition cursor-pointer"
    [class]="mode() === 'register' ? 'bg-white text-black shadow' : 'text-gray-500 hover:text-black'"
    (click)="switchMode.emit('register')"
  >
    Registrarse
  </button>
</div>
