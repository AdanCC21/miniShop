<div>
  @if (label()) {
    <label [for]="id()" class="mb-1 block text-sm font-medium text-gray-700">{{ label() }}</label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 outline-none transition focus:border-[var(--primary)]"
  />
</div>
