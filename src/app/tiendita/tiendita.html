<div class="space-y-6" animate.enter="ms-fade-in-up">
  <div>
    <h1 class="text-2xl font-bold text-black">Tiendita</h1>
    <p class="text-sm text-gray-500">Edita la información de tu tiendita.</p>
  </div>

  <section>
    <h2 class="mb-3 text-sm font-semibold uppercase tracking-wider text-gray-500">Información de la tiendita</h2>
    <div class="max-w-xl rounded-lg border border-gray-200 bg-white p-6">
      <div class="space-y-4">
        <app-input
          id="store-name"
          label="Nombre de la tienda"
          type="text"
          placeholder="Nombre de la tienda"
          [value]="storeName()"
          (valueChange)="onNameChange($event)"
        />

        <div>
          <p class="mb-1 text-sm font-medium text-gray-700">UID de la tienda</p>
          <p class="rounded-lg bg-gray-50 px-3 py-2 text-sm font-mono text-gray-500">{{ storeUid }}</p>
          <p class="mt-1 text-xs text-gray-400">Los empleados lo usan para solicitar acceso.</p>
        </div>

        <div class="flex items-center gap-3">
          <app-button text="Guardar cambios" (clicked)="save()" />
          @if (saved()) {
            <span class="text-sm font-medium text-green-600" animate.enter="ms-fade-in-up">Cambios guardados</span>
          }
        </div>
      </div>
    </div>
  </section>
</div>
