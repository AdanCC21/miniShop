<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  (mousedown)="onBackdropClick()"
>
  <div
    class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-xl bg-white shadow-xl {{ sizeClass() }}"
    (mousedown)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
      <h2 class="text-lg font-semibold text-black">{{ title() }}</h2>
      <button
        type="button"
        aria-label="Cerrar"
        class="rounded-md p-1.5 text-gray-500 transition hover:bg-gray-100 hover:text-black"
        (click)="close.emit()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="overflow-y-auto px-6 py-4">
      <ng-content />
    </div>
  </div>
</div>
